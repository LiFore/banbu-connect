allow-lan: false
bind-address: 127.0.0.1
dns:
    default-nameserver:
        - https://223.5.5.5/dns-query
        - https://1.12.12.12/dns-query
    enable: true
    enhanced-mode: redir-host
    listen: 127.0.0.1:1053
    nameserver:
        - tls://1.1.1.1:853#代理模式
        - https://1.1.1.1/dns-query#代理模式
    nameserver-policy:
        geosite:cn:
            - https://223.5.5.5/dns-query
            - https://1.12.12.12/dns-query
        geosite:geolocation-!cn:
            - tls://1.1.1.1:853#代理模式
            - https://1.1.1.1/dns-query#代理模式
        us.example.com:
            - https://223.5.5.5/dns-query
            - https://1.12.12.12/dns-query
    prefer-h3: false
external-controller: 127.0.0.1:19190
find-process-mode: strict
geodata-mode: true
geox-url:
    asn: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb
    geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip-lite.dat
    geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
    mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country-lite.mmdb
ipv6: true
listeners:
    - listen: 127.0.0.1
      name: probe-0
      port: 19200
      proxy: Claude
      type: http
    - listen: 127.0.0.1
      name: route-0
      port: 19300
      proxy: DIRECT
      type: http
    - listen: 127.0.0.1
      name: route-1
      port: 19301
      proxy: Claude
      type: http
    - listen: 127.0.0.1
      name: route-2
      port: 19302
      proxy: 代理模式
      type: http
    - listen: 127.0.0.1
      name: route-3
      port: 19303
      proxy: 漏网之鱼
      type: http
    - listen: 127.0.0.1
      name: route-4
      port: 19304
      proxy: 自动
      type: http
    - listen: 127.0.0.1
      name: gate-direct
      port: 19181
      proxy: DIRECT
      type: http
log-level: warning
mixed-port: 7890
mode: rule
profile:
    store-selected: true
proxies:
    - cipher: aes-128-gcm
      name: 香港 - 01
      password: x
      port: 8388
      server: 198.51.100.1
      type: ss
    - cipher: aes-128-gcm
      name: 美国 - 01
      password: x
      port: 8388
      server: us.example.com
      type: ss
    - name: 出口闸门·Claude
      password: g
      port: 19180
      server: 127.0.0.1
      type: socks5
      udp: false
      username: Claude
proxy-groups:
    - name: Claude
      proxies:
        - 香港 - 01
      type: select
    - name: 代理模式
      proxies:
        - 香港 - 01
        - DIRECT
      type: select
    - name: 漏网之鱼
      proxies:
        - DIRECT
        - 代理模式
      type: select
    - hidden: true
      interval: 300
      name: 自动
      proxies:
        - 香港 - 01
      tolerance: 50
      type: url-test
      url: http://t
    - name: 路由盒·代理模式
      proxies:
        - 代理模式
        - DIRECT
      type: select
    - name: 路由盒·漏网之鱼
      proxies:
        - 漏网之鱼
        - DIRECT
      type: select
rule-providers:
    apple:
        behavior: domain
        interval: 86400
        path: ./ruleset/apple.yaml
        proxy: 代理模式
        type: http
        url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt
    applications:
        behavior: classical
        interval: 86400
        path: ./ruleset/applications.yaml
        proxy: 代理模式
        type: http
        url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt
    claude:
        behavior: classical
        interval: 86400
        path: ./ruleset/claude.yaml
        proxy: 代理模式
        type: http
        url: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Claude/Claude.yaml
    cncidr:
        behavior: ipcidr
        interval: 86400
        path: ./ruleset/cncidr.yaml
        proxy: 代理模式
        type: http
        url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt
    direct:
        behavior: domain
        interval: 86400
        path: ./ruleset/direct.yaml
        proxy: 代理模式
        type: http
        url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
    gfw:
        behavior: domain
        interval: 86400
        path: ./ruleset/gfw.yaml
        proxy: 代理模式
        type: http
        url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt
    google:
        behavior: domain
        interval: 86400
        path: ./ruleset/google.yaml
        proxy: 代理模式
        type: http
        url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt
    greatfire:
        behavior: domain
        interval: 86400
        path: ./ruleset/greatfire.yaml
        proxy: 代理模式
        type: http
        url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/greatfire.txt
    icloud:
        behavior: domain
        interval: 86400
        path: ./ruleset/icloud.yaml
        proxy: 代理模式
        type: http
        url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt
    lancidr:
        behavior: ipcidr
        interval: 86400
        path: ./ruleset/lancidr.yaml
        proxy: 代理模式
        type: http
        url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
    private:
        behavior: domain
        interval: 86400
        path: ./ruleset/private.yaml
        proxy: 代理模式
        type: http
        url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt
    proxy:
        behavior: domain
        interval: 86400
        path: ./ruleset/proxy.yaml
        proxy: 代理模式
        type: http
        url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt
    tld-not-cn:
        behavior: domain
        interval: 86400
        path: ./ruleset/tld-not-cn.yaml
        proxy: 代理模式
        type: http
        url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt
rules:
    - DOMAIN-SUFFIX,ping0.cc,出口闸门·Claude
    - AND,((DOMAIN-SUFFIX,anthropic.com),(NETWORK,udp)),REJECT
    - DOMAIN-SUFFIX,anthropic.com,出口闸门·Claude
    - AND,((DOMAIN-SUFFIX,claude.ai),(NETWORK,udp)),REJECT
    - DOMAIN-SUFFIX,claude.ai,出口闸门·Claude
    - AND,((DOMAIN-SUFFIX,off.example.com),(NETWORK,udp)),REJECT
    - DOMAIN-SUFFIX,off.example.com,出口闸门·Claude
    - DOMAIN,testingcf.jsdelivr.net,DIRECT
    - RULE-SET,claude,出口闸门·Claude
    - RULE-SET,direct,DIRECT
    - RULE-SET,private,DIRECT
    - RULE-SET,cncidr,DIRECT,no-resolve
    - RULE-SET,lancidr,DIRECT,no-resolve
    - GEOIP,LAN,DIRECT,no-resolve
    - GEOIP,CN,DIRECT,no-resolve
    - RULE-SET,applications,DIRECT
    - RULE-SET,tld-not-cn,路由盒·代理模式
    - RULE-SET,google,路由盒·代理模式
    - RULE-SET,icloud,路由盒·代理模式
    - RULE-SET,apple,路由盒·代理模式
    - RULE-SET,gfw,路由盒·代理模式
    - RULE-SET,greatfire,路由盒·代理模式
    - RULE-SET,proxy,路由盒·代理模式
    - MATCH,路由盒·漏网之鱼
secret: s
sniffer:
    enable: true
    force-dns-mapping: true
    parse-pure-ip: true
    sniff:
        HTTP:
            override-destination: true
            ports:
                - 80
                - 8080-8880
        QUIC:
            ports:
                - 443
                - 8443
        TLS:
            ports:
                - 443
                - 8443
tcp-concurrent: true
tun:
    auto-detect-interface: true
    auto-route: true
    dns-hijack:
        - any:53
    dns-mode: hijack
    enable: true
    stack: mixed
    strict-route: false
unified-delay: true
